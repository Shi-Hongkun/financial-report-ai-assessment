[project]
name = "htx-fde-ai-assessment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hongkun-Shi-EY", email = "Hongkun.Shi@sg.ey.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "openai>=3.26.0",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
pdf-benchmark = [
    "docling>=2.135.0",
    "langchain-community>=0.4.2",
    "markitdown[pdf]>=0.1.8",
    "pypdf>=6.19.0",
]

[project.scripts]
htx-fde-ai-assessment = "htx_fde_ai_assessment:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
